  const navShort = document.getElementById('navShort');
  const ctl = window.AlphaRadarShortTerm.initShortTermModule({
    shortData: PREVIEW_SHORT_DATA,
    mountEl: document.getElementById('shortTermView'),
    longViewEl: document.getElementById('longTermView'),
    todayTeaserEl: document.getElementById('todayShortTeaser'),
    onViewChange(view) {
      navLong.classList.toggle('active', view === 'long');
      navShort.classList.toggle('active', view === 'short');
    }
  });
  navLong.addEventListener('click', e => { e.preventDefault(); ctl.switchView('long'); });
  navShort.addEventListener('click', e => { e.preventDefault(); ctl.switchView('short'); });
  ctl.switchView('short');
})();
</script>
</body>
</html>
