# 行业雷达：每个 [[industry]] 是一个行业。页面按总分（四项之和）从高到低排序。
# 评分口径（各 1–5 分，整数）：
#   boom      景气度：需求增速与资本开支强度，5 = 最强
#   delivery  业绩兑现：龙头最近财报是否已兑现高增长，5 = 大幅兑现
#   choke     卡点强度：供给瓶颈是否清晰并带来定价权，5 = 极紧
#   valuation 估值位置：相对历史与增速的性价比，5 = 回调最充分 / 最便宜
# 级别（自动计算）：总分 ≥ 17 重点追踪；14–16 持续观察；≤ 13 低频跟踪。
# kb：知识库笔记在仓库里的相对路径（相对仓库根目录），留空则页面不显示「知识库笔记」按钮。

