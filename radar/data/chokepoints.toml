# 关键卡点：每个 [[chokepoint]] 属于一个行业（industry 必须与 industries.toml 里的 name 完全一致）。
# 有卡点的行业才会出现在「卡点地图」和「龙头热力图」里；同一行业内按紧缺度（极紧 > 偏紧 > 缓解中）再按本文件顺序排列。
# tightness 只能是：极紧 / 偏紧 / 缓解中
# track 的财报日期用 {{earnings:公司id}} 引用 companies.toml；日期和核验状态只有一个事实源。

[[chokepoint]]
name = "光芯片与激光器"
industry = "AI网络与光互连"
tightness = "极紧"
segment = "EML/CW激光器、InP衬底、硅光芯片"
why = "1.6T与CPO需要更多高速激光器，InP扩产慢、认证周期长；Lumentum部分器件订单排至2029（转述）"
track = "Lumentum/Coherent订单与扩产、源杰三季报（{{earnings:YJKJ}}）、EML价格"

