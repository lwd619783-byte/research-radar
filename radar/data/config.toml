# 投研雷达 · 全局配置。改完运行 python radar/scripts/build.py --check 校验。

[site]
title = "投研雷达"
# GitHub 仓库地址（形如 https://github.com/用户名/仓库名）。留空则页面不显示「知识库笔记」与「打开 GitHub 仓库」按钮。
# 注意：私有仓库的链接只有登录且有权限的人能打开。
repo_url = ""
kb_branch = "main"

[build]
source = "notion"

[schedule]
cron_utc = ["45 0 * * 1-5", "15 4 * * 1-5", "15 10 * * 1-5", "50 22 * * 0"]
late_after_minutes = 180

[notion]
contract = "notion_schema.json"
api_base = "https://api.notion.com"
version = "2026-03-11"
timeout_seconds = 20
phase_budget_seconds = 180
max_body_bytes = 8388608
max_pages_per_table = 50
min_interval_seconds = 0.34
quality_threshold = 0.20
quality_min_rows = 5

[daily]
markets = ["A股", "美股"]
chips."A股" = ["000001.SS", "399006.SZ", "HSTECH.HK"]
chips."美股" = ["^IXIC", "^GSPC", "^SOX"]
short = { "000001.SS" = "上证", "399006.SZ" = "创业板", "HSTECH.HK" = "恒生科技", "^IXIC" = "纳指", "^GSPC" = "标普500", "^SOX" = "费城半导体" }

# 跑马灯指数。symbol 用 Yahoo 代码；tencent 为腾讯备用代码（可省略）。
[[index]]
symbol = "000001.SS"
name = "上证指数"
tencent = "sh000001"

[[index]]
symbol = "399006.SZ"
name = "创业板指"
tencent = "sz399006"

[[index]]
symbol = "000922.SS"
name = "中证红利"
tencent = "sh000922"

[[index]]
symbol = "^HSI"
name = "恒生指数"
tencent = "hkHSI"

[[index]]
symbol = "HSTECH.HK"
name = "恒生科技"
tencent = "hkHSTECH"

[[index]]
symbol = "^IXIC"
name = "纳斯达克"

[[index]]
symbol = "^GSPC"
name = "标普500"

[[index]]
symbol = "^SOX"
name = "费城半导体"

# 红利定投温度计：创业板指 ÷ 中证红利 月线。一般不用改。
[ratio]
growth_tencent = "sz399006"
growth_yahoo = "399006.SZ"
dividend_tencent = "sh000922"
dividend_yahoo = "000922.SS"

# 汇率抓取失败时的兜底值（1 美元兑当地货币；EURUSD 为 1 欧元兑美元）。只用于市值折算，偶尔更新即可。
[fx_fallback]
CNY = 6.6862
HKD = 7.8479
TWD = 32.428
KRW = 1329.6
JPY = 157.987
EURUSD = 1.1244
