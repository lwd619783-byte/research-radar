{
  "name": "Radar interface acceptance",
  "run-name": "Radar interface acceptance ${{ github.event.pull_request.number || inputs.reviewed_sha }}",
  "on": {
    "pull_request": {"branches": ["fix/radar-truthfulness-2026-10-18", "v3/pr3-ui"]},
    "workflow_dispatch": {
      "inputs": {
        "reviewed_sha": {"description": "Exact independently reviewed commit SHA", "required": true, "type": "string"},
        "zero_cost_verified": {"description": "Included minutes/storage and zero paid-overage budget verified", "required": true, "type": "boolean", "default": false}
      }
    }
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "radar-interface-acceptance", "cancel-in-progress": false},
  "jobs": {
    "acceptance": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/radar-truthfulness-2026-10-18' && github.run_attempt == 1 && inputs.zero_cost_verified == true && inputs.reviewed_sha == github.sha",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Validate reviewed SHA and cost authorization",
          "env": {"REVIEWED_SHA": "${{ inputs.reviewed_sha }}", "ZERO_COST_VERIFIED": "${{ inputs.zero_cost_verified }}"},
          "run": "set -euo pipefail\ntest \"$GITHUB_EVENT_NAME\" = workflow_dispatch\ntest \"$GITHUB_REF\" = refs/heads/fix/radar-truthfulness-2026-10-18\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\ntest \"$ZERO_COST_VERIFIED\" = true\n[[ \"$REVIEWED_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$REVIEWED_SHA\" = \"$GITHUB_SHA\"\n"
        },
        {
          "name": "Checkout exact execution commit",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"persist-credentials": false, "fetch-depth": 0, "ref": "${{ github.sha }}"}
        },
        {
          "name": "Verify checked-out HEAD equals reviewed execution SHA",
          "env": {"REVIEWED_SHA": "${{ inputs.reviewed_sha }}"},
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\ntest \"$(git rev-parse HEAD)\" = \"$REVIEWED_SHA\"\n"
        },
        {
          "name": "Python 3.12",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {"python-version": "3.12"}
        },
        {
          "name": "Offline regression, schema and frozen hashes before requests",
          "run": "python -B radar/scripts/acceptance_probe.py --preflight"
        },
        {
          "name": "Bounded read-only interface acceptance",
          "id": "probe",
          "timeout-minutes": 16,
          "run": "python -B radar/scripts/acceptance_probe.py --out \"$RUNNER_TEMP/radar-interface-acceptance/receipt.json\""
        },
        {
          "name": "Verify complete archive allowlist, hashes and 10 MB limit",
          "id": "archive_verify",
          "run": "python -B radar/scripts/acceptance_probe.py --verify-bundle \"$RUNNER_TEMP/radar-interface-acceptance\""
        },
        {
          "name": "Upload only the verified diagnostic archive",
          "if": "success() && steps.probe.outcome == 'success' && steps.archive_verify.outcome == 'success'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "radar-interface-acceptance-${{ github.run_id }}",
            "path": "${{ runner.temp }}/radar-interface-acceptance/DATA.json\n${{ runner.temp }}/radar-interface-acceptance/index.html\n${{ runner.temp }}/radar-interface-acceptance/receipt.json\n${{ runner.temp }}/radar-interface-acceptance/manifest.json",
            "retention-days": 7,
            "if-no-files-found": "error",
            "compression-level": 9,
            "include-hidden-files": false
          }
        }
      ]
    },
    "visual": {
      "if": "github.event_name == 'pull_request' && github.repository == 'lwd619783-byte/research-radar'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout PR merge commit",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Python 3.12",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install pinned browser test dependency",
          "run": "python -m pip install --disable-pip-version-check -r radar/tools/visual-requirements.txt\npython -m playwright install --with-deps chromium"
        },
        {
          "name": "Build isolated offline fixture pages",
          "run": "python -B radar/tools/build_visual_fixtures.py --out \"$RUNNER_TEMP/radar-visual-pages\""
        },
        {
          "name": "Verify six viewport/theme pairs and five state pages",
          "run": "python -B radar/tools/visual_acceptance.py --pages \"$RUNNER_TEMP/radar-visual-pages\" --out \"$RUNNER_TEMP/radar-visual-acceptance\""
        },
        {
          "name": "Upload visual review evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "radar-v3-visual-${{ github.run_id }}",
            "path": "${{ runner.temp }}/radar-visual-acceptance/*.png\n${{ runner.temp }}/radar-visual-acceptance/report.json",
            "retention-days": 7,
            "if-no-files-found": "error",
            "compression-level": 9,
            "include-hidden-files": false
          }
        }
      ]
    }
  }
}
