{
  "name": "Radar offline PR checks",
  "on": {"pull_request": {"branches": ["fix/radar-truthfulness-2026-10-18"]}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "radar-offline-${{ github.event.pull_request.number }}", "cancel-in-progress": true},
  "jobs": {
    "offline": {
      "if": "github.repository == 'lwd619783-byte/research-radar'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {"uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262", "with": {"fetch-depth": 0, "persist-credentials": false}},
        {"uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065", "with": {"python-version": "3.12"}},
        {"name": "All offline regressions and schema preflight", "run": "python -B radar/scripts/acceptance_probe.py --preflight"}
      ]
    }
  }
}
