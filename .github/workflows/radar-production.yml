{
  "name": "Radar refresh and publish",
  "on": {
    "schedule": [
      {
        "cron": "45 0 * * 1-5"
      },
      {
        "cron": "15 4 * * 1-5"
      },
      {
        "cron": "15 10 * * 1-5"
      },
      {
        "cron": "50 22 * * 0"
      }
    ],
    "push": {
      "branches": [
        "fix/radar-truthfulness-2026-10-18"
      ],
      "paths": [
        "radar/**",
        ".github/workflows/radar-production.yml",
        "audit/truthfulness-frozen.json",
        "!radar/README.md",
        "!radar/docs/**"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "trigger": {
          "description": "Manual recovery or external schedule tick",
          "type": "choice",
          "required": false,
          "default": "manual",
          "options": [
            "manual",
            "external_schedule"
          ]
        },
        "schedule_slot": {
          "description": "External schedule slot; leave none for manual recovery",
          "type": "choice",
          "required": false,
          "default": "none",
          "options": [
            "none",
            "weekday-0845",
            "weekday-1215",
            "weekday-1815",
            "monday-0650"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "radar-production",
    "cancel-in-progress": false
  },
  "jobs": {
    "refresh": {
      "if": "github.repository == 'lwd619783-byte/research-radar' && github.ref == 'refs/heads/fix/radar-truthfulness-2026-10-18' && github.run_attempt == 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "permissions": {
        "contents": "write",
        "statuses": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Verify source identity",
          "run": "test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\""
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Read verified baseline and admit scheduled slot",
          "id": "baseline",
          "run": "python -B radar/scripts/release_operations.py baseline --path \"$RUNNER_TEMP/radar-baseline\"\npython -B radar/scripts/schedule_admission.py --baseline \"$RUNNER_TEMP/radar-baseline\"",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "All offline regressions and contract checks before requests",
          "run": "python -B radar/scripts/acceptance_probe.py --preflight",
          "id": "preflight",
          "if": "steps.baseline.outputs.skip != 'true'"
        },
        {
          "name": "Read Notion once, then collect bounded market data",
          "timeout-minutes": 20,
          "run": "python -B radar/scripts/production_collect.py --out \"$RUNNER_TEMP/radar-current/receipt.json\" --work \"$RUNNER_TEMP/radar-work\" --baseline \"$RUNNER_TEMP/radar-baseline\"",
          "id": "collect",
          "env": {
            "NOTION_TOKEN": "${{ secrets.NOTION_TOKEN }}"
          },
          "if": "steps.baseline.outputs.skip != 'true'"
        },
        {
          "name": "Require fresh same-run data and all publication gates",
          "run": "python -B radar/scripts/production_release.py --bundle \"$RUNNER_TEMP/radar-current\" --out \"$RUNNER_TEMP/radar-release\" --baseline \"$RUNNER_TEMP/radar-baseline\"\ncd \"$RUNNER_TEMP/radar-release\"\nnode verify-release.cjs --check-only",
          "id": "prepare",
          "if": "steps.baseline.outputs.skip != 'true'"
        },
        {
          "name": "Publish checked static files to production Git branch",
          "run": "bash radar/scripts/publish_release.sh",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "id": "publish",
          "if": "steps.baseline.outputs.skip != 'true'"
        },
        {
          "name": "Verify Vercel result or retain old data with failure notice",
          "id": "result",
          "if": "always()",
          "timeout-minutes": 10,
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "STAGE_OUTCOMES": "${{ toJSON(steps) }}",
            "PUBLISHED_SHA": "${{ steps.publish.outputs.production_sha }}",
            "SCHEDULE_ADMISSION": "${{ steps.baseline.outputs.admission }}"
          },
          "run": "python -B radar/scripts/release_operations.py finish --path \"$RUNNER_TEMP\" --sha \"$PUBLISHED_SHA\""
        },
        {
          "name": "Keep redacted diagnostics even on failure",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "radar-production-${{ github.run_id }}",
            "path": "${{ runner.temp }}/radar-current/DATA.json\n${{ runner.temp }}/radar-current/index.html\n${{ runner.temp }}/radar-current/receipt.json\n${{ runner.temp }}/radar-current/manifest.json\n${{ runner.temp }}/radar-release/release.json\n${{ runner.temp }}/release-result.json\n${{ runner.temp }}/radar-current/research-snapshot.json\n${{ runner.temp }}/radar-work/step-summary.md",
            "retention-days": 7,
            "if-no-files-found": "warn",
            "include-hidden-files": false
          }
        }
      ]
    }
  }
}
